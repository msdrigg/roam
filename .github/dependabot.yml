# Dependabot configuration.
#
# Scopes automated dependency updates to the manifests we actually ship/run.
# The reverse-engineering research sandbox under docs/notes/ is intentionally
# NOT listed here, so Dependabot will not open version-update PRs against it.
#
# Note: this file controls version-update (and security-update) PRs. It does not
# retroactively dismiss existing Dependabot *alerts* for unlisted paths - those
# are dismissed once in the Security tab (reason: "not used / inaccurate").
version: 2
updates:
  # Rust - main backend
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The App Store receipt path pairs these with cms 0.2 and rsa 0.9, whose
    # newer lines are still pre-release. Bumping them alone breaks the build.
    ignore:
      - dependency-name: x509-cert
        update-types: ["version-update:semver-minor"]
      - dependency-name: der
        update-types: ["version-update:semver-minor"]
      - dependency-name: sha1
        update-types: ["version-update:semver-minor"]
    groups:
      backend-cargo:
        patterns:
          - "*"

  # JavaScript - Docusaurus docs site
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      docs-npm:
        patterns:
          - "*"

  # Python - helper scripts
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      scripts-pip:
        patterns:
          - "*"

  # Docker - backend image bases (cargo-chef, debian slim)
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  # Swift - the GRDB wrapper package. The app's own pins live in the Xcode
  # project's Package.resolved, which Dependabot cannot read.
  - package-ecosystem: swift
    directory: /LocalPackages/RoamGRDB
    schedule:
      interval: weekly

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
